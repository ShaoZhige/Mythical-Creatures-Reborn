modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"
logoFile="logo.png"
logoBlur=false

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5,)"
    ordering="NONE"
    side="BOTH"

# GeckoLib 声明为可选依赖，且不限制版本：
# 允许由原生 Forge 版 GeckoLib 提供，也允许由经 Sinytra Connector 在 Forge 上运行的 Fabric 版提供。
# 两版的公开 API 签名一致，因此实际可用性改由启动期的 GeckoLibCompat 自检把关，
# 缺失时给出可读的中英文提示，而不是任由后续的实体 / 渲染器类随机抛出 NoClassDefFoundError。
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config="mythical_creatures_reborn.mixins.json"
