org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=false
# 内嵌 JDK 17（toolchain 解析用）。此文件不提交，按实际安装路径填写。
org.gradle.java.installations.paths=E:/worksmc/Mythical_Creatures_Reborn/runtime/jdk-17.0.17+10
org.gradle.java.installations.auto-download=false

systemProp.gradle.user.home=./.gradle_repo

# ── 构建强制离线 ──────────────────────────────────────────────────────────────
# 实现见 .gradle_repo/init.d/force-offline.gradle（Gradle 自动加载）。
# 依赖已全部缓存于 .gradle_repo，离线构建无需联网。
# 需要联网拉取新依赖时：设环境变量 MC_ALLOW_ONLINE=1。
#
# ForgeGradle 的 EnvironmentChecks 走 JDK 原生 HttpURLConnection 做联网检查，不受 --offline 约束，
# 网络不通时会一直挂住。以下超时只作用于 JDK 原生 HTTP（Gradle 自身下载走 Apache HttpClient，不受影响）。
systemProp.sun.net.client.defaultConnectTimeout=5000
systemProp.sun.net.client.defaultReadTimeout=5000

